# DP-WP5 Railway build configuration. The application Dockerfile remains the
# frozen implementation under deployment/railway.

[build]
builder = "DOCKERFILE"
dockerfilePath = "deployment/railway/Dockerfile"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
# No start or release command: Railway has no lifecycle or migration authority.
